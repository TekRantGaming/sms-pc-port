name: Game window settings
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  window:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: ['64', '32']
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install SDL and software OpenGL
        env:
          ARCH: ${{ matrix.arch }}
        timeout-minutes: 15
        run: |
          # The Azure Ubuntu mirror sometimes stalls a connection without
          # closing it, which apt's own timeout doesn't catch. Kill and retry.
          apt() { for n in 1 2 3; do sudo timeout 240 apt-get -o Acquire::Retries=3 "$@" && return; echo "apt-get $1 attempt $n failed"; done; return 1; }
          if [ "$ARCH" = 32 ]; then sudo dpkg --add-architecture i386; fi
          apt update
          apt install -y --no-install-recommends cmake g++-multilib python3 patch binutils xvfb xauth openbox x11-utils libsdl2-dev libegl-dev libgl-dev libgl1-mesa-dri libegl-mesa0
          # The port already supports 32-bit SDL using the host's headers and
          # i386 runtime libraries. Avoid incompatible multiarch GLib dev tools.
          if [ "$ARCH" = 32 ]; then
            apt install -y --no-install-recommends libsdl2-2.0-0:i386 libegl1:i386 libgl1:i386 libgl1-mesa-dri:i386 libegl-mesa0:i386
          fi
      - name: Build the game's window smoke test
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          cmake -S . -B build/window -DCMAKE_BUILD_TYPE=Release -DSMS_ARCH="$ARCH" -DSMS_GX_BUILD_TESTS=ON
          cmake --build build/window --target gx_windowtest gx_windowsmoke -j2
      - name: Check window placement, fullscreen, and headless rendering
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          ctest --test-dir build/window/platform/gx -R '^gx_windowtest$' --output-on-failure
          # SDL desktop fullscreen is managed by the desktop window manager.
          xvfb-run -a -s '-screen 0 1280x800x24' bash -e -c '
            openbox --sm-disable > build/window/window-manager.log 2>&1 &
            window_wm_pid=$!
            trap "kill $window_wm_pid" EXIT
            for attempt in {1..100}; do
              if xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id #"; then break; fi
              sleep 0.05
            done
            xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id #"
            env -u SMS_FULLSCREEN build/window/platform/gx/gx_windowsmoke --window
            SMS_FULLSCREEN=0 build/window/platform/gx/gx_windowsmoke --window
            SMS_FULLSCREEN=1 build/window/platform/gx/gx_windowsmoke --fullscreen
          '
          SMS_FULLSCREEN=1 build/window/platform/gx/gx_windowsmoke --headless
