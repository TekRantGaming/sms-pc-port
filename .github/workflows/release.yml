# Builds the port for Windows (MSYS2 MINGW64, zip) and Linux (64-bit AppImage)
# on every push to main and pull request, and publishes both as a GitHub
# release when a v* tag is pushed. The packages hold no game data: players
# install their own disc image from the launcher.
name: Build and release

on:
  push:
    branches: [main, pc-launcher]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Allow long paths
        run: git config --system core.longpaths true
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-ninja mingw-w64-x86_64-make mingw-w64-x86_64-python
            patch git p7zip mingw-w64-x86_64-libarchive
      - name: Build
        shell: msys2 {0}
        run: ./build.sh
      - name: Package
        shell: msys2 {0}
        run: packaging/package.sh "$(git describe --tags --always)"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.zip

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake make python3 patch binutils g++ \
            libsdl2-dev libegl-dev libgl-dev file libarchive-tools
      - name: Build
        run: SMS_ARCH=64 ./build.sh
      - name: Package
        run: packaging/package.sh "$(git describe --tags --always)"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/*.AppImage

  release:
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Super Mario Sunshine PC Port ${{ github.ref_name }}
          body_path: packaging/RELEASE_NOTES.md
          files: |
            dist/*.zip
            dist/*.AppImage
