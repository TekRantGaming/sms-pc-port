name: Eclipse build
# Builds the 64-bit game with and without Super Mario Eclipse on each platform
# and starts it far enough to see whether the mods' constructors were linked in
# where platform/mods/modhooks.cpp finds them. No disc image is used.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  eclipse:
    strategy:
      fail-fast: false
      matrix:
        eclipse: ['1', '0']
        os: [ubuntu-24.04, macos-15, windows-2025]
        include:
          - os: ubuntu-24.04
            shell: bash
          - os: macos-15
            shell: bash
          - os: windows-2025
            shell: msys2 {0}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: ${{ matrix.shell }}
        working-directory: Eclipse CI with spaces/port
    name: ${{ matrix.os }}${{ matrix.eclipse == '1' && ' Eclipse' || ' Sunshine' }}
    env:
      SMS_ARCH: '64'
      SMS_ECLIPSE: ${{ matrix.eclipse }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          path: Eclipse CI with spaces/port
      - name: Install Linux tools
        if: runner.os == 'Linux'
        timeout-minutes: 25
        run: |
          # Some runners can't reach the Azure Ubuntu mirror, and apt's fallback
          # to archive.ubuntu.com can stall a download without closing it, which
          # apt's own timeout doesn't catch. Kill it and switch mirrors instead.
          apt_update() {
            sudo timeout 120 apt-get update && return
            for mirror in http://mirrors.edge.kernel.org/ubuntu/ http://mirror.math.princeton.edu/pub/ubuntu/; do
              echo "apt-get update failed; switching to $mirror"
              echo "$mirror" | sudo tee /etc/apt/apt-mirrors.txt
              sudo timeout 120 apt-get update && return
            done
            return 1
          }
          apt_install() { for n in 1 2 3; do sudo timeout 300 apt-get -o Acquire::Retries=3 install -y --no-install-recommends "$@" && return; echo "apt-get install attempt $n failed"; done; return 1; }
          apt_update
          apt_install cmake make python3 patch binutils g++ clang llvm libsdl2-dev libegl-dev libgl-dev
      - name: Install Mac tools
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "SMS_LLVM_BIN=$(brew --prefix llvm)/bin" >> "$GITHUB_ENV"
          sudo softwareupdate --install-rosetta --agree-to-license
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          update: true
          install: >-
            git patch mingw-w64-x86_64-gcc mingw-w64-x86_64-clang mingw-w64-x86_64-llvm-tools
            mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja mingw-w64-x86_64-make
            mingw-w64-x86_64-python mingw-w64-x86_64-SDL2
      - name: Install compiler cache
        if: runner.os == 'Windows'
        uses: Mozilla-Actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: v0.18.0
      - name: Enable compiler cache
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "SMS_COMPILER_CACHE=$((Get-Command sccache).Source.Replace('\', '/'))" >> $env:GITHUB_ENV
          "SCCACHE_GHA_ENABLED=on" >> $env:GITHUB_ENV
          "SCCACHE_IGNORE_SERVER_IO_ERROR=1" >> $env:GITHUB_ENV
      - name: Test Windows cross compiler cache routing
        if: runner.os == 'Windows'
        run: python tools/tests/test_msys_cross_compile.py
      - name: Test partial-link response files with long paths
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then python tools/mods/tests/test_object_response.py
          else python3 tools/mods/tests/test_object_response.py; fi
      - name: Build Eclipse
        run: ./build.sh
      - name: Check SHI flag masks
        if: runner.os == 'Linux' && matrix.eclipse == '1'
        run: python3 tools/mods/test_shi_flags.py build/linux-64-eclipse/eclipse-src/shi --compiler clang++ --arch 64
      - name: Check whether the mods are linked in
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then os=linux; elif [[ "$RUNNER_OS" == macOS ]]; then os=macos; else os=windows; fi
          exe=build/$os-64$([[ "$SMS_ECLIPSE" != 1 ]] || echo -eclipse)/sms
          [[ "$os" != windows ]] || exe+=.exe
          head -c 32 /dev/zero > invalid.iso
          set +e
          limit=$(command -v timeout || command -v gtimeout || true)
          SMS_CODE_MODS=0 SMS_HEADLESS=1 SMS_SAVE_DIR="$PWD/test-saves" SMS_DISC_IMAGE="$PWD/invalid.iso" \
            ${limit:+$limit 60} "$exe" "$PWD/invalid.iso" > start.log 2>&1
          echo "exit status $?"
          set -e
          cat start.log
          if [[ "$SMS_ECLIPSE" == 1 ]]; then grep -q 'code mods linked in but switched off' start.log
          else ! grep -q 'code mods linked in' start.log; fi
          grep -q 'not a usable GameCube disc image' start.log
      - name: Collect the Windows executable and its DLLs
        if: runner.os == 'Windows' && matrix.eclipse == '1'
        run: |
          mkdir -p windows-game
          cp build/windows-64-eclipse/sms.exe windows-game/
          ldd build/windows-64-eclipse/sms.exe | awk '$3 ~ /^\/mingw64\// { print $3 }' | xargs -r -I{} cp {} windows-game/
          ls -l windows-game
      # For testing a change on a Windows machine before it is released.
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && matrix.eclipse == '1'
        with:
          name: windows-64-eclipse
          path: Eclipse CI with spaces/port/windows-game
          retention-days: 7
      - name: Show the Windows executable's sections
        if: failure() && runner.os == 'Windows'
        run: |
          exe=build/windows-64$([[ "$SMS_ECLIPSE" != 1 ]] || echo -eclipse)/sms.exe
          ls -l "$exe"
          objdump -p "$exe" | sed -n '1,60p'
          objdump -h "$exe"
